<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Z-Road request flow</title>
  <desc>A request travels from the consumer system through two security servers to the provider system and the signed response returns the same way.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F7A4D"/>
    </marker>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="719" rx="18" fill="#FBFCFA" stroke="#DDE5DF"/>
  <rect x="0.5" y="0.5" width="959" height="6" rx="3" fill="#1F7A4D"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0F172A">How a request flows</text>
  <text x="40" y="66" font-size="13" fill="#64748B">Both sides sign and log, so either party can later prove what was asked and answered.</text>

  <!-- Z-Road network band -->
  <rect x="330" y="150" width="300" height="540" rx="14" fill="#E6F2EA"/>
  <text x="480" y="676" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#1F7A4D" text-anchor="middle">Z-ROAD NETWORK · mTLS</text>

  <!-- Lifelines -->
  <g stroke="#CBD5CF" stroke-width="1.5" stroke-dasharray="4 5">
    <line x1="120" y1="136" x2="120" y2="660"/>
    <line x1="360" y1="136" x2="360" y2="660"/>
    <line x1="600" y1="136" x2="600" y2="660"/>
    <line x1="840" y1="136" x2="840" y2="660"/>
  </g>

  <!-- Participants -->
  <g filter="url(#sh)">
    <rect x="30" y="86" width="180" height="50" rx="12" fill="#FFFFFF" stroke="#C9D3CC"/>
    <rect x="270" y="86" width="180" height="50" rx="12" fill="#1F7A4D"/>
    <rect x="510" y="86" width="180" height="50" rx="12" fill="#1F7A4D"/>
    <rect x="750" y="86" width="180" height="50" rx="12" fill="#FFFFFF" stroke="#C9D3CC"/>
  </g>
  <g font-size="13.5" font-weight="600" text-anchor="middle">
    <text x="120" y="116" fill="#0F172A">Consumer system</text>
    <text x="360" y="116" fill="#FFFFFF">Consumer Security Server</text>
    <text x="600" y="116" fill="#FFFFFF">Provider Security Server</text>
    <text x="840" y="116" fill="#0F172A">Provider system</text>
  </g>

  <!-- 1 -->
  <line x1="120" y1="188" x2="356" y2="188" stroke="#64748B" stroke-width="2" marker-end="url(#arrS)"/>
  <text x="238" y="178" font-size="12.5" fill="#0F172A" text-anchor="middle"><tspan font-weight="700" fill="#1F7A4D">1</tspan>  Request (service path + payload)</text>

  <!-- 2 -->
  <rect x="255" y="212" width="210" height="30" rx="15" fill="#FFF3C4" stroke="#E6B800"/>
  <text x="360" y="231.5" font-size="12" fill="#6B5200" text-anchor="middle"><tspan font-weight="700">2</tspan>  Sign · timestamp · log</text>

  <!-- 3 -->
  <line x1="360" y1="288" x2="596" y2="288" stroke="#1F7A4D" stroke-width="3" marker-end="url(#arr)"/>
  <text x="480" y="278" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle"><tspan font-weight="700" fill="#1F7A4D">3</tspan>  mTLS + signed request</text>

  <!-- 4 -->
  <rect x="470" y="312" width="260" height="30" rx="15" fill="#FFF3C4" stroke="#E6B800"/>
  <text x="600" y="331.5" font-size="12" fill="#6B5200" text-anchor="middle"><tspan font-weight="700">4</tspan>  Verify member · check access · log</text>

  <!-- 5 -->
  <line x1="600" y1="388" x2="836" y2="388" stroke="#64748B" stroke-width="2" marker-end="url(#arrS)"/>
  <text x="718" y="378" font-size="12.5" fill="#0F172A" text-anchor="middle"><tspan font-weight="700" fill="#1F7A4D">5</tspan>  Forward request</text>

  <!-- 6 -->
  <line x1="840" y1="440" x2="604" y2="440" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrS)"/>
  <text x="722" y="430" font-size="12.5" fill="#0F172A" text-anchor="middle"><tspan font-weight="700" fill="#1F7A4D">6</tspan>  Response</text>

  <!-- 7 -->
  <rect x="495" y="464" width="210" height="30" rx="15" fill="#FFF3C4" stroke="#E6B800"/>
  <text x="600" y="483.5" font-size="12" fill="#6B5200" text-anchor="middle"><tspan font-weight="700">7</tspan>  Sign · timestamp · log</text>

  <!-- 8 -->
  <line x1="600" y1="540" x2="364" y2="540" stroke="#1F7A4D" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arr)"/>
  <text x="482" y="530" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle"><tspan font-weight="700" fill="#1F7A4D">8</tspan>  Signed response</text>

  <!-- 9 -->
  <rect x="235" y="564" width="250" height="30" rx="15" fill="#FFF3C4" stroke="#E6B800"/>
  <text x="360" y="583.5" font-size="12" fill="#6B5200" text-anchor="middle"><tspan font-weight="700">9</tspan>  Verify signature · log</text>

  <!-- 10 -->
  <line x1="360" y1="636" x2="124" y2="636" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrS)"/>
  <text x="242" y="626" font-size="12.5" fill="#0F172A" text-anchor="middle"><tspan font-weight="700" fill="#1F7A4D">10</tspan>  Response</text>
</svg>

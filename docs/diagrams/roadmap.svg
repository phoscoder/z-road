<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Z-Road roadmap</title><desc>Phases 0 to 4 are done, phase 5 hardening is in progress, the pilot is gated on governance and review, then production readiness and scale.</desc>
<defs><marker id="a-2B4A9B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B4A9B"/></marker><marker id="a-0F172A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="a-64748B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="a-B42318" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker><marker id="a-1F7A4D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A4D"/></marker><marker id="a-94A3B8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="a-9B1C1C" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B1C1C"/></marker><marker id="a-E6B800" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E6B800"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs>
<rect x="0.5" y="0.5" width="959" height="649" rx="18" fill="#FBFCFA" stroke="#DDE5DF"/>
<rect x="0.5" y="0.5" width="959" height="6" rx="3" fill="#1F7A4D"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#0F172A">Roadmap</text><text x="40" y="66" font-size="13" fill="#64748B">Where Z-Road is and what comes next. Green is done, gold is under way, blue is planned.</text>
<rect x="30" y="96" width="172" height="300" rx="14" fill="#EAF4EE" stroke="#1F7A4D" stroke-width="1.2" filter="url(#sh)"/>
<text x="44" y="124" font-size="10.5" font-weight="700" fill="#14593A" text-anchor="start" letter-spacing="1.2">PHASE 0–4</text>
<text x="44" y="148" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start">Foundations</text>
<rect x="44" y="158" width="84" height="22" rx="11.0" fill="#1F7A4D" stroke="none" stroke-width="0"/>
<text x="86.0" y="173.0" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Done</text>
<text x="44" y="206" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• Protocol and threat</text>
<text x="44" y="221" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  model</text>
<text x="44" y="243" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• Security server,</text>
<text x="44" y="258" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  central server,</text>
<text x="44" y="273" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  timestamps</text>
<text x="44" y="295" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• Proof of concept →</text>
<text x="44" y="310" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  first use case</text>
<text x="44" y="332" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• Resilience,</text>
<text x="44" y="347" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  transparency, access</text>
<text x="44" y="362" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  control</text>
<text x="44" y="384" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• Catalogue, schemas,</text>
<text x="44" y="399" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  shared nodes, SDKs</text>
<line x1="202" y1="220" x2="214" y2="220" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#a-94A3B8)"/>
<rect x="214" y="96" width="172" height="300" rx="14" fill="#FFF3C4" stroke="#E6B800" stroke-width="1.2" filter="url(#sh)"/>
<text x="228" y="124" font-size="10.5" font-weight="700" fill="#6B5200" text-anchor="start" letter-spacing="1.2">PHASE 5</text>
<text x="228" y="148" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start">Hardening</text>
<rect x="228" y="158" width="84" height="22" rx="11.0" fill="#E6B800" stroke="none" stroke-width="0"/>
<text x="270.0" y="173.0" font-size="11" font-weight="700" fill="#6B5200" text-anchor="middle">In progress</text>
<text x="228" y="206" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• Fuzzing, fail-closed</text>
<text x="228" y="221" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  audit, renewal ✓</text>
<text x="228" y="243" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• Key custody: offline</text>
<text x="228" y="258" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  root CA + HSM</text>
<text x="228" y="280" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• Operator MFA / SSO</text>
<text x="228" y="302" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• Longer fuzz campaigns</text>
<text x="228" y="324" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• Independent security</text>
<text x="228" y="339" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  review</text>
<line x1="386" y1="220" x2="398" y2="220" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#a-94A3B8)"/>
<rect x="398" y="96" width="172" height="300" rx="14" fill="#E3EAFB" stroke="#9DB2E8" stroke-width="1.2" filter="url(#sh)"/>
<text x="412" y="124" font-size="10.5" font-weight="700" fill="#2B4A9B" text-anchor="start" letter-spacing="1.2">PHASE 6</text>
<text x="412" y="148" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start">Pilot</text>
<rect x="412" y="158" width="84" height="22" rx="11.0" fill="#9DB2E8" stroke="none" stroke-width="0"/>
<text x="454.0" y="173.0" font-size="11" font-weight="700" fill="#2B4A9B" text-anchor="middle">Gated</text>
<text x="412" y="206" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• One provider, a few</text>
<text x="412" y="221" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  consumers</text>
<text x="412" y="243" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• Real CA ceremony</text>
<text x="412" y="265" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• Data-sharing agreements</text>
<text x="412" y="287" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• Citizen login at the</text>
<text x="412" y="302" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  provider</text>
<text x="412" y="324" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• Measured against clear</text>
<text x="412" y="339" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  targets</text>
<line x1="570" y1="220" x2="582" y2="220" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#a-94A3B8)"/>
<rect x="582" y="96" width="172" height="300" rx="14" fill="#E3EAFB" stroke="#9DB2E8" stroke-width="1.2" filter="url(#sh)"/>
<text x="596" y="124" font-size="10.5" font-weight="700" fill="#2B4A9B" text-anchor="start" letter-spacing="1.2">PHASE 7</text>
<text x="596" y="148" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start">Production</text>
<rect x="596" y="158" width="84" height="22" rx="11.0" fill="#9DB2E8" stroke="none" stroke-width="0"/>
<text x="638.0" y="173.0" font-size="11" font-weight="700" fill="#2B4A9B" text-anchor="middle">Planned</text>
<text x="596" y="206" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• High availability</text>
<text x="596" y="228" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• Metrics and dashboards</text>
<text x="596" y="250" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• Signed releases,</text>
<text x="596" y="265" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  packages, SBOM</text>
<text x="596" y="287" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• Runbooks proven in</text>
<text x="596" y="302" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  drills</text>
<text x="596" y="324" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• More clients (PHP, C#,</text>
<text x="596" y="339" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  JS, Java)</text>
<line x1="754" y1="220" x2="766" y2="220" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#a-94A3B8)"/>
<rect x="766" y="96" width="172" height="300" rx="14" fill="#E3EAFB" stroke="#9DB2E8" stroke-width="1.2" filter="url(#sh)"/>
<text x="780" y="124" font-size="10.5" font-weight="700" fill="#2B4A9B" text-anchor="start" letter-spacing="1.2">PHASE 8</text>
<text x="780" y="148" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start">Scale</text>
<rect x="780" y="158" width="84" height="22" rx="11.0" fill="#9DB2E8" stroke="none" stroke-width="0"/>
<text x="822.0" y="173.0" font-size="11" font-weight="700" fill="#2B4A9B" text-anchor="middle">Later</text>
<text x="780" y="206" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• More services and</text>
<text x="780" y="221" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  members</text>
<text x="780" y="243" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• Federation with other</text>
<text x="780" y="258" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  exchanges</text>
<text x="780" y="280" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• Large payloads and</text>
<text x="780" y="295" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  streaming</text>
<text x="780" y="317" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• Ecosystem and ERP plug-</text>
<text x="780" y="332" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">  ins</text>
<text x="780" y="354" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">• Service-level reporting</text>
<rect x="30" y="420" width="900" height="200" rx="16" fill="#FFFFFF" stroke="#C9DDD0" stroke-width="1.2"/>
<text x="50" y="448" font-size="10.5" font-weight="700" fill="#1F7A4D" text-anchor="start" letter-spacing="1.2">RUNS IN PARALLEL, AND DECIDES WHETHER A PILOT HAPPENS</text>
<rect x="50" y="466" width="120" height="26" rx="13" fill="#FFF3C4" stroke="none" stroke-width="0"/>
<text x="110" y="483.5" font-size="12" font-weight="700" fill="#6B5200" text-anchor="middle">Governance</text>
<text x="184" y="483.5" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Choose the authority; who may join; who runs the CA</text>
<rect x="50" y="501" width="120" height="26" rx="13" fill="#FFF3C4" stroke="none" stroke-width="0"/>
<text x="110" y="518.5" font-size="12" font-weight="700" fill="#6B5200" text-anchor="middle">Legal</text>
<text x="184" y="518.5" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Data protection review; data-sharing agreements; DPIA</text>
<rect x="50" y="536" width="120" height="26" rx="13" fill="#FFF3C4" stroke="none" stroke-width="0"/>
<text x="110" y="553.5" font-size="12" font-weight="700" fill="#6B5200" text-anchor="middle">Assurance</text>
<text x="184" y="553.5" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Independent code review and penetration test</text>
<rect x="50" y="571" width="120" height="26" rx="13" fill="#FFF3C4" stroke="none" stroke-width="0"/>
<text x="110" y="588.5" font-size="12" font-weight="700" fill="#6B5200" text-anchor="middle">People</text>
<text x="184" y="588.5" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">Pilot partners (start with ZIMRA); training; communications</text>
</svg>

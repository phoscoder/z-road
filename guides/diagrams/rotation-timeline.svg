<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Certificate rotation without dropped calls</title><desc>A new certificate is first listed and only later used, so peers have learned it before it appears. The previous certificate is accepted for a grace period and then retired.</desc>
<defs><marker id="a-64748B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="a-E6B800" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E6B800"/></marker><marker id="a-2B4A9B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B4A9B"/></marker><marker id="a-B42318" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker><marker id="a-1F7A4D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A4D"/></marker><marker id="a-0F172A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="a-94A3B8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="a-9B1C1C" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B1C1C"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs>
<rect x="0.5" y="0.5" width="959" height="499" rx="18" fill="#FBFCFA" stroke="#DDE5DF"/>
<rect x="0.5" y="0.5" width="959" height="6" rx="3" fill="#1F7A4D"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#0F172A">Rotation without dropped calls</text><text x="40" y="66" font-size="13" fill="#64748B">Two phases: announce the new certificate, then switch to it.</text>
<line x1="90" y1="370" x2="900" y2="370" stroke="#94A3B8" stroke-width="2"/>
<line x1="90" y1="362" x2="90" y2="378" stroke="#0F172A" stroke-width="2"/>
<text x="90" y="396" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">t = 0</text>
<text x="90" y="413" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">renewed</text>
<line x1="310" y1="362" x2="310" y2="378" stroke="#0F172A" stroke-width="2"/>
<text x="310" y="396" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">+65 s</text>
<text x="310" y="413" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">switch</text>
<line x1="690" y1="362" x2="690" y2="378" stroke="#0F172A" stroke-width="2"/>
<text x="690" y="396" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">+10 min</text>
<text x="690" y="413" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">old retired</text>
<text x="90" y="110" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">The central directory lists</text>
<rect x="90" y="118" width="810" height="38" rx="10" fill="#EAF4EE" stroke="none" stroke-width="0"/>
<text x="495.0" y="142" font-size="12" font-weight="600" fill="#1F7A4D" text-anchor="middle">new certificate (current)  ·  old certificate kept in history</text>
<text x="90" y="188" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">The member presents</text>
<rect x="90" y="196" width="220" height="38" rx="10" fill="#FFF3C4" stroke="none" stroke-width="0"/>
<text x="200.0" y="220" font-size="12" font-weight="600" fill="#6B5200" text-anchor="middle">old certificate</text>
<rect x="310" y="196" width="590" height="38" rx="10" fill="#EAF4EE" stroke="none" stroke-width="0"/>
<text x="605.0" y="220" font-size="12" font-weight="600" fill="#1F7A4D" text-anchor="middle">new certificate</text>
<text x="90" y="266" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">Peers accept</text>
<rect x="90" y="274" width="600" height="38" rx="10" fill="#E3EAFB" stroke="none" stroke-width="0"/>
<text x="390.0" y="298" font-size="12" font-weight="600" fill="#2B4A9B" text-anchor="middle">old and new</text>
<rect x="690" y="274" width="210" height="38" rx="10" fill="#EAF4EE" stroke="none" stroke-width="0"/>
<text x="795.0" y="298" font-size="12" font-weight="600" fill="#1F7A4D" text-anchor="middle">new only</text>
<rect x="98" y="430" width="800" height="36" rx="10" fill="#FFFFFF" stroke="#C9DDD0" stroke-width="1.2"/>
<text x="498" y="459" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">Defaults: switch after 65 s (2 × directory refresh + 5)  ·  grace 600 s  ·  renew 30 days before expiry</text>
</svg>

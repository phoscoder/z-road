<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Operators, roles and the citizen lane</title><desc>Auditor, operator and admin form a ladder; the portal role is a separate lane that only reaches the citizen endpoint. Every privileged action is logged first.</desc>
<defs><marker id="a-64748B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="a-E6B800" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E6B800"/></marker><marker id="a-2B4A9B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B4A9B"/></marker><marker id="a-B42318" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker><marker id="a-1F7A4D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A4D"/></marker><marker id="a-0F172A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="a-94A3B8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="a-9B1C1C" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B1C1C"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs>
<rect x="0.5" y="0.5" width="959" height="639" rx="18" fill="#FBFCFA" stroke="#DDE5DF"/>
<rect x="0.5" y="0.5" width="959" height="6" rx="3" fill="#1F7A4D"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#0F172A">Who may do what</text><text x="40" y="66" font-size="13" fill="#64748B">Named people with their own tokens. Citizens are never given one.</text>
<rect x="40" y="96" width="600" height="96" rx="14" fill="#FFFFFF" stroke="#C9DDD0" stroke-width="1.2"/>
<text x="58" y="122" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">How it works</text>
<text x="58" y="144" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">• Every person has their own token. Only its hash is stored in a config file.</text>
<text x="58" y="161" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">• Failed logins are slowed down; removing an operator takes effect straight away.</text>
<text x="58" y="178" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">• The role decides what a token may do. The ladder grows to the right.</text>
<rect x="40" y="380" width="190" height="186" rx="14" fill="#fff" stroke="#C9D3CC" stroke-width="1.2" filter="url(#sh)"/>
<text x="56" y="408" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start">Auditor</text>
<text x="56" y="426" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">read only</text>
<text x="56" y="450" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">• Audit log status</text>
<text x="56" y="467" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">• Stored proofs</text>
<text x="56" y="484" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">• Look up a subject (logged)</text>
<text x="56" y="501" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">• Certificate status</text>
<rect x="240" y="300" width="190" height="266" rx="14" fill="#EAF4EE" stroke="#C9DDD0" stroke-width="1.2" filter="url(#sh)"/>
<text x="256" y="328" font-size="16" font-weight="700" fill="#14593A" text-anchor="start">Operator</text>
<text x="256" y="346" font-size="11.5" font-weight="400" fill="#4C7A62" text-anchor="start">changes state</text>
<text x="256" y="370" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">• All an auditor can, plus:</text>
<text x="256" y="387" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">• Refresh the directory</text>
<text x="256" y="404" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">• Anchor the log, renew</text>
<text x="256" y="421" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">• Republish services</text>
<text x="256" y="438" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">• Register members*</text>
<rect x="440" y="220" width="190" height="346" rx="14" fill="#1F7A4D" stroke="#1F7A4D" stroke-width="1.2" filter="url(#sh)"/>
<text x="456" y="248" font-size="16" font-weight="700" fill="#fff" text-anchor="start">Admin</text>
<text x="456" y="266" font-size="11.5" font-weight="400" fill="#CFE9DA" text-anchor="start">everything</text>
<text x="456" y="290" font-size="11.5" font-weight="400" fill="#fff" text-anchor="start">• All an operator can, plus:</text>
<text x="456" y="307" font-size="11.5" font-weight="400" fill="#fff" text-anchor="start">• Revoke members*</text>
<text x="450" y="560" font-size="11" font-weight="400" fill="#CFE9DA" text-anchor="start" font-style="italic">* central server only</text>
<rect x="670" y="96" width="260" height="470" rx="16" fill="#E3EAFB" stroke="#9DB2E8" stroke-width="1.2" stroke-dasharray="6 4" fill-opacity="0.7"/>
<text x="688" y="122" font-size="10.5" font-weight="700" fill="#2B4A9B" text-anchor="start" letter-spacing="1.2">SEPARATE LANE</text>
<rect x="690" y="142" width="220" height="78" rx="12" fill="#E3EAFB" stroke="#9DB2E8" stroke-width="1.2" filter="url(#sh)"/>
<text x="800.0" y="179.0" font-size="14" font-weight="600" fill="#2B4A9B" text-anchor="middle">Portal</text>
<text x="800.0" y="197.0" font-size="11.5" font-weight="400" fill="#5A74B8" text-anchor="middle">a citizen-facing web service</text>
<text x="690" y="252" font-size="11.5" font-weight="400" fill="#2B4A9B" text-anchor="start">Can use only:</text>
<text x="690" y="269" font-size="11.5" font-weight="400" fill="#2B4A9B" text-anchor="start">GET /citizen/v1/access-log</text>
<text x="690" y="286" font-size="11.5" font-weight="400" fill="#2B4A9B" text-anchor="start">and only with a valid</text>
<text x="690" y="303" font-size="11.5" font-weight="400" fill="#2B4A9B" text-anchor="start">identity assertion for the</text>
<text x="690" y="320" font-size="11.5" font-weight="400" fill="#2B4A9B" text-anchor="start">person who is logged in.</text>
<rect x="690" y="372" width="220" height="112" rx="12" fill="#FFFFFF" stroke="#F0A8A8" stroke-width="1.2"/>
<text x="704" y="396" font-size="12" font-weight="700" fill="#9B1C1C" text-anchor="start">Cannot</text>
<text x="704" y="416" font-size="11.5" font-weight="400" fill="#9B1C1C" text-anchor="start">× touch any admin endpoint</text>
<text x="704" y="434" font-size="11.5" font-weight="400" fill="#9B1C1C" text-anchor="start">× choose whose record to read</text>
<text x="704" y="452" font-size="11.5" font-weight="400" fill="#9B1C1C" text-anchor="start">× act as an operator</text>
<rect x="40" y="584" width="890" height="40" rx="12" fill="#FFF3C4" stroke="#E6B800" stroke-width="1.2"/>
<text x="485" y="609" font-size="12.5" font-weight="600" fill="#6B5200" text-anchor="middle">Every privileged action is written to the tamper-evident log before it runs. If it cannot be logged, it is not done.</text>
</svg>

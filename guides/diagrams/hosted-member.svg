<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A hosted member keeps its own key</title><desc>A vendor's shared node carries traffic for small members, but each member signs with its own key in a signer service on its own machine.</desc>
<defs><marker id="a-64748B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="a-E6B800" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E6B800"/></marker><marker id="a-2B4A9B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B4A9B"/></marker><marker id="a-B42318" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker><marker id="a-1F7A4D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A4D"/></marker><marker id="a-0F172A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="a-94A3B8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="a-9B1C1C" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B1C1C"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs>
<rect x="0.5" y="0.5" width="959" height="559" rx="18" fill="#FBFCFA" stroke="#DDE5DF"/>
<rect x="0.5" y="0.5" width="959" height="6" rx="3" fill="#1F7A4D"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#0F172A">Shared node with member-held keys</text><text x="40" y="66" font-size="13" fill="#64748B">The node can carry a member's traffic. It cannot make the member say something.</text>
<rect x="30" y="90" width="470" height="390" rx="16" fill="#F4F6F5" stroke="#CBD5D0" stroke-width="1.2" fill-opacity="0.85"/>
<text x="48" y="115" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1.2">THE VENDOR'S SHARED NODE</text>
<rect x="50" y="130" width="200" height="90" rx="12" fill="#1F7A4D" stroke="#1F7A4D" stroke-width="1.2" filter="url(#sh)"/>
<text x="150.0" y="165.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Security server</text>
<text x="150.0" y="183.0" font-size="11.5" font-weight="400" fill="#CFE9DA" text-anchor="middle">the node's own identity</text>
<text x="150.0" y="199.0" font-size="11.5" font-weight="400" fill="#CFE9DA" text-anchor="middle">TLS to peers</text>
<rect x="270" y="130" width="210" height="90" rx="12" fill="#FFFFFF" stroke="#C9D3CC" stroke-width="1.2" filter="url(#sh)"/>
<text x="375.0" y="173.0" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Hosted member A</text>
<text x="375.0" y="191.0" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">own audit log, tokens, rules</text>
<rect x="270" y="240" width="210" height="90" rx="12" fill="#FFFFFF" stroke="#C9D3CC" stroke-width="1.2" filter="url(#sh)"/>
<text x="375.0" y="283.0" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Hosted member B</text>
<text x="375.0" y="301.0" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">own audit log, tokens, rules</text>
<text x="60" y="262" font-size="12" font-weight="700" fill="#0F172A" text-anchor="start">Holds:</text>
<text x="60" y="282" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">• the node's certificate</text>
<text x="60" y="299" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">• each member's certificate</text>
<text x="60" y="316" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">  (public)</text>
<text x="60" y="352" font-size="12" font-weight="700" fill="#9B1C1C" text-anchor="start">Never holds:</text>
<text x="60" y="372" font-size="11.5" font-weight="400" fill="#9B1C1C" text-anchor="start">× any hosted member's</text>
<text x="60" y="389" font-size="11.5" font-weight="400" fill="#9B1C1C" text-anchor="start">  private key</text>
<line x1="250" y1="175" x2="270" y2="175" stroke="#64748B" stroke-width="1.8" marker-end="url(#a-64748B)"/>
<path d="M 250,200 L 262,200 L 262,285 L 270,285" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#a-64748B)"/>
<rect x="540" y="90" width="390" height="390" rx="16" fill="#EAF4EE" stroke="#C9DDD0" stroke-width="1.2" fill-opacity="0.85"/>
<text x="558" y="115" font-size="10.5" font-weight="700" fill="#1F7A4D" text-anchor="start" letter-spacing="1.2">EACH MEMBER'S OWN MACHINE</text>
<rect x="560" y="130" width="350" height="100" rx="12" fill="#EAF4EE" stroke="#C9DDD0" stroke-width="1.2" filter="url(#sh)"/>
<text x="735.0" y="170.0" font-size="14" font-weight="600" fill="#14593A" text-anchor="middle">Signer service A</text>
<text x="735.0" y="188.0" font-size="11.5" font-weight="400" fill="#4C7A62" text-anchor="middle">holds member A's private key</text>
<text x="735.0" y="204.0" font-size="11.5" font-weight="400" fill="#4C7A62" text-anchor="middle">signs only A's own messages</text>
<rect x="560" y="250" width="350" height="100" rx="12" fill="#EAF4EE" stroke="#C9DDD0" stroke-width="1.2" filter="url(#sh)"/>
<text x="735.0" y="290.0" font-size="14" font-weight="600" fill="#14593A" text-anchor="middle">Signer service B</text>
<text x="735.0" y="308.0" font-size="11.5" font-weight="400" fill="#4C7A62" text-anchor="middle">holds member B's private key</text>
<text x="735.0" y="324.0" font-size="11.5" font-weight="400" fill="#4C7A62" text-anchor="middle">signs only B's own messages</text>
<rect x="560" y="372" width="350" height="88" rx="12" fill="#FFFFFF" stroke="#C9DDD0" stroke-width="1.2"/>
<text x="576" y="396" font-size="12" font-weight="700" fill="#1F7A4D" text-anchor="start">The signer checks before signing</text>
<text x="576" y="415" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">✓ only for the node it is set up for</text>
<text x="576" y="431" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">✓ only this member's own requests and answers</text>
<text x="576" y="447" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">✓ writes its own audit log first, then signs</text>
<line x1="480" y1="175" x2="560" y2="175" stroke="#1F7A4D" stroke-width="2.6" marker-end="url(#a-1F7A4D)" marker-start="url(#a-1F7A4D)"/>
<line x1="480" y1="285" x2="560" y2="285" stroke="#1F7A4D" stroke-width="2.6" marker-end="url(#a-1F7A4D)" marker-start="url(#a-1F7A4D)"/>
<rect x="494" y="155" width="62" height="20" rx="10" fill="#1F7A4D" stroke="none" stroke-width="0"/>
<text x="525" y="169" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">sign this</text>
<rect x="30" y="498" width="900" height="48" rx="12" fill="#FFF3C4" stroke="#E6B800" stroke-width="1.2"/>
<text x="480" y="520" font-size="12.5" font-weight="600" fill="#6B5200" text-anchor="middle">Peers accept a hosted member only from its node, and verify every message with the member's own key.</text>
<text x="480" y="537" font-size="12" font-weight="400" fill="#8A6D00" text-anchor="middle">A hosted member cannot bypass its node. Revoke the node and everything it hosts is cut off.</text>
</svg>

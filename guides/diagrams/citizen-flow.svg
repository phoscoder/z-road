<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>How a citizen sees who looked at their data</title><desc>The citizen logs in to the provider's own system, which issues a short-lived signed assertion. The portal passes it to the security server, which answers only for the identifier inside it.</desc>
<defs><marker id="a-64748B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="a-E6B800" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E6B800"/></marker><marker id="a-2B4A9B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B4A9B"/></marker><marker id="a-B42318" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker><marker id="a-1F7A4D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A4D"/></marker><marker id="a-0F172A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="a-94A3B8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="a-9B1C1C" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B1C1C"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs>
<rect x="0.5" y="0.5" width="959" height="509" rx="18" fill="#FBFCFA" stroke="#DDE5DF"/>
<rect x="0.5" y="0.5" width="959" height="6" rx="3" fill="#1F7A4D"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#0F172A">Citizen view: who looked at my record?</text><text x="40" y="66" font-size="13" fill="#64748B">The portal never chooses whose record to read.</text>
<rect x="30" y="120" width="150" height="80" rx="12" fill="#E3EAFB" stroke="#9DB2E8" stroke-width="1.2" filter="url(#sh)"/>
<text x="105.0" y="158.0" font-size="14" font-weight="600" fill="#2B4A9B" text-anchor="middle">Citizen</text>
<text x="105.0" y="176.0" font-size="11.5" font-weight="400" fill="#5A74B8" text-anchor="middle">opens the portal</text>
<rect x="230" y="120" width="170" height="80" rx="12" fill="#FFF3C4" stroke="#E6B800" stroke-width="1.2" filter="url(#sh)"/>
<text x="315.0" y="150.0" font-size="14" font-weight="600" fill="#6B5200" text-anchor="middle">Login system</text>
<text x="315.0" y="168.0" font-size="11.5" font-weight="400" fill="#8A6D00" text-anchor="middle">e.g. ZIMRA e-services</text>
<text x="315.0" y="184.0" font-size="11.5" font-weight="400" fill="#8A6D00" text-anchor="middle">proves who they are</text>
<rect x="450" y="120" width="150" height="80" rx="12" fill="#E3EAFB" stroke="#9DB2E8" stroke-width="1.2" filter="url(#sh)"/>
<text x="525.0" y="158.0" font-size="14" font-weight="600" fill="#2B4A9B" text-anchor="middle">Portal</text>
<text x="525.0" y="176.0" font-size="11.5" font-weight="400" fill="#5A74B8" text-anchor="middle">holds a portal token</text>
<rect x="650" y="120" width="140" height="80" rx="12" fill="#1F7A4D" stroke="#1F7A4D" stroke-width="1.2" filter="url(#sh)"/>
<text x="720.0" y="158.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Security server</text>
<text x="720.0" y="176.0" font-size="11.5" font-weight="400" fill="#CFE9DA" text-anchor="middle">provider</text>
<rect x="820" y="120" width="110" height="80" rx="12" fill="#FFFFFF" stroke="#C9D3CC" stroke-width="1.2" filter="url(#sh)"/>
<text x="875.0" y="158.0" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Audit log</text>
<text x="875.0" y="176.0" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">who, when, what</text>
<circle cx="205" cy="100" r="13" fill="#E6B800" stroke="none" stroke-width="0"/>
<text x="205" y="104.5" font-size="13" font-weight="700" fill="#6B5200" text-anchor="middle">1</text>
<circle cx="425" cy="100" r="13" fill="#E6B800" stroke="none" stroke-width="0"/>
<text x="425" y="104.5" font-size="13" font-weight="700" fill="#6B5200" text-anchor="middle">2</text>
<circle cx="625" cy="100" r="13" fill="#1F7A4D" stroke="none" stroke-width="0"/>
<text x="625" y="104.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<circle cx="805" cy="100" r="13" fill="#1F7A4D" stroke="none" stroke-width="0"/>
<text x="805" y="104.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<line x1="180" y1="160" x2="230" y2="160" stroke="#2B4A9B" stroke-width="2" marker-end="url(#a-2B4A9B)"/>
<line x1="400" y1="160" x2="450" y2="160" stroke="#E6B800" stroke-width="2" marker-end="url(#a-E6B800)"/>
<line x1="600" y1="160" x2="650" y2="160" stroke="#2B4A9B" stroke-width="2" marker-end="url(#a-2B4A9B)"/>
<line x1="790" y1="160" x2="820" y2="160" stroke="#64748B" stroke-width="2" marker-end="url(#a-64748B)"/>
<text x="205" y="232" font-size="12.5" font-weight="700" fill="#6B5200" text-anchor="middle">1  The citizen logs in</text>
<text x="205" y="250" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">the way they already do</text>
<text x="425" y="232" font-size="12.5" font-weight="700" fill="#6B5200" text-anchor="middle">2  An assertion is issued</text>
<text x="425" y="250" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">signed, for this provider,</text>
<text x="425" y="266" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">valid for at most 10 minutes</text>
<text x="655" y="232" font-size="12.5" font-weight="700" fill="#1F7A4D" text-anchor="middle">3  The portal asks</text>
<text x="655" y="250" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">portal token + assertion</text>
<text x="655" y="266" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">(no subject parameter)</text>
<text x="840" y="232" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">4  The lookup is</text>
<text x="840" y="250" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">recorded (keyed hash,</text>
<text x="840" y="266" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">never the identifier)</text>
<rect x="30" y="300" width="900" height="186" rx="14" fill="#FFFFFF" stroke="#C9DDD0" stroke-width="1.2"/>
<text x="50" y="326" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">The security server checks, in order</text>
<circle cx="60" cy="352" r="10" fill="#EAF4EE" stroke="none" stroke-width="0"/>
<text x="60" y="356.5" font-size="13" font-weight="700" fill="#1F7A4D" text-anchor="middle">1</text>
<text x="80" y="357" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">The token belongs to an operator with the portal role</text>
<circle cx="60" cy="378" r="10" fill="#EAF4EE" stroke="none" stroke-width="0"/>
<text x="60" y="382.5" font-size="13" font-weight="700" fill="#1F7A4D" text-anchor="middle">2</text>
<text x="80" y="383" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">The assertion is signed by a trusted issuer (no unknown key)</text>
<circle cx="60" cy="404" r="10" fill="#EAF4EE" stroke="none" stroke-width="0"/>
<text x="60" y="408.5" font-size="13" font-weight="700" fill="#1F7A4D" text-anchor="middle">3</text>
<text x="80" y="409" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">It was issued for this provider, is not expired and lasts no more than 10 minutes</text>
<circle cx="60" cy="430" r="10" fill="#EAF4EE" stroke="none" stroke-width="0"/>
<text x="60" y="434.5" font-size="13" font-weight="700" fill="#1F7A4D" text-anchor="middle">4</text>
<text x="80" y="435" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">It is not forged: change one character of the identifier and the signature breaks</text>
<text x="50" y="468" font-size="12" font-weight="600" fill="#1F7A4D" text-anchor="start">Then it returns that person's lookups only: who looked, when, for which service, and the result.</text>
</svg>

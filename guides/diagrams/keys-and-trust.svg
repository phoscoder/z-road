<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Who holds which key</title><desc>A table of every key and secret in a Z-Road network: who holds it, what it protects, and how serious it is if stolen.</desc>
<defs><marker id="a-64748B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="a-E6B800" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E6B800"/></marker><marker id="a-2B4A9B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B4A9B"/></marker><marker id="a-B42318" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker><marker id="a-1F7A4D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A4D"/></marker><marker id="a-0F172A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="a-94A3B8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="a-9B1C1C" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B1C1C"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs>
<rect x="0.5" y="0.5" width="959" height="689" rx="18" fill="#FBFCFA" stroke="#DDE5DF"/>
<rect x="0.5" y="0.5" width="959" height="6" rx="3" fill="#1F7A4D"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#0F172A">Who holds which key</text><text x="40" y="66" font-size="13" fill="#64748B">Know your secrets: the higher the impact, the better protected it should be.</text>
<rect x="30" y="92" width="900" height="34" rx="10" fill="#1F7A4D" stroke="none" stroke-width="0"/>
<text x="44" y="114" font-size="12" font-weight="700" fill="#fff" text-anchor="start">Key or secret</text>
<text x="304" y="114" font-size="12" font-weight="700" fill="#fff" text-anchor="start">Held by</text>
<text x="494" y="114" font-size="12" font-weight="700" fill="#fff" text-anchor="start">What it does</text>
<text x="824" y="114" font-size="12" font-weight="700" fill="#fff" text-anchor="start">If stolen</text>
<rect x="30" y="132" width="900" height="44" rx="8" fill="#FFFFFF" stroke="#E3EAE5" stroke-width="1"/>
<text x="44" y="151" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">Root CA key</text>
<text x="44" y="167" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" font-style="italic">Offline or in an HSM</text>
<text x="304" y="158" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">the authority</text>
<text x="494" y="158" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Signs every member certificate.</text>
<rect x="824" y="143" width="78" height="22" rx="11.0" fill="#FDE8E8" stroke="none" stroke-width="0"/>
<text x="863.0" y="158.0" font-size="11" font-weight="700" fill="#9B1C1C" text-anchor="middle">Critical</text>
<rect x="30" y="181" width="900" height="44" rx="8" fill="#F6F9F7" stroke="#E3EAE5" stroke-width="1"/>
<text x="44" y="200" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">Central TLS key</text>
<text x="304" y="207" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">central server</text>
<text x="494" y="207" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Authenticates the directory to members.</text>
<rect x="824" y="192" width="78" height="22" rx="11.0" fill="#FFF3C4" stroke="none" stroke-width="0"/>
<text x="863.0" y="207.0" font-size="11" font-weight="700" fill="#6B5200" text-anchor="middle">High</text>
<rect x="30" y="230" width="900" height="44" rx="8" fill="#FFFFFF" stroke="#E3EAE5" stroke-width="1"/>
<text x="44" y="249" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">Member key (one per organisation)</text>
<text x="304" y="256" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">the member</text>
<text x="494" y="256" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Signs its messages and proves its identity.</text>
<rect x="824" y="241" width="78" height="22" rx="11.0" fill="#FFF3C4" stroke="none" stroke-width="0"/>
<text x="863.0" y="256.0" font-size="11" font-weight="700" fill="#6B5200" text-anchor="middle">High</text>
<rect x="30" y="279" width="900" height="44" rx="8" fill="#F6F9F7" stroke="#E3EAE5" stroke-width="1"/>
<text x="44" y="298" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">Hosted member key</text>
<text x="304" y="305" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">the member's own signer</text>
<text x="494" y="305" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Signs for a member that a vendor node carries.</text>
<rect x="824" y="290" width="78" height="22" rx="11.0" fill="#FFF3C4" stroke="none" stroke-width="0"/>
<text x="863.0" y="305.0" font-size="11" font-weight="700" fill="#6B5200" text-anchor="middle">High</text>
<rect x="30" y="328" width="900" height="44" rx="8" fill="#FFFFFF" stroke="#E3EAE5" stroke-width="1"/>
<text x="44" y="347" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">Node key</text>
<text x="304" y="354" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">the vendor (node operator)</text>
<text x="494" y="354" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Authenticates the shared node's TLS.</text>
<rect x="824" y="339" width="78" height="22" rx="11.0" fill="#FFF3C4" stroke="none" stroke-width="0"/>
<text x="863.0" y="354.0" font-size="11" font-weight="700" fill="#6B5200" text-anchor="middle">High</text>
<rect x="30" y="377" width="900" height="44" rx="8" fill="#F6F9F7" stroke="#E3EAE5" stroke-width="1"/>
<text x="44" y="396" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">Timestamp authority key</text>
<text x="304" y="403" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">the authority</text>
<text x="494" y="403" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Dates audit-log heads.</text>
<rect x="824" y="388" width="78" height="22" rx="11.0" fill="#FFF3C4" stroke="none" stroke-width="0"/>
<text x="863.0" y="403.0" font-size="11" font-weight="700" fill="#6B5200" text-anchor="middle">High</text>
<rect x="30" y="426" width="900" height="44" rx="8" fill="#FFFFFF" stroke="#E3EAE5" stroke-width="1"/>
<text x="44" y="445" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">Citizen login issuer key</text>
<text x="304" y="452" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">the provider's login system</text>
<text x="494" y="452" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Vouches that a citizen controls an identifier.</text>
<rect x="824" y="437" width="78" height="22" rx="11.0" fill="#FFF3C4" stroke="none" stroke-width="0"/>
<text x="863.0" y="452.0" font-size="11" font-weight="700" fill="#6B5200" text-anchor="middle">High</text>
<rect x="30" y="475" width="900" height="44" rx="8" fill="#F6F9F7" stroke="#E3EAE5" stroke-width="1"/>
<text x="44" y="494" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">Operator and portal tokens</text>
<text x="44" y="510" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" font-style="italic">Stored only as hashes</text>
<text x="304" y="501" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">named people and portals</text>
<text x="494" y="501" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Administration; portals ask only citizen questions.</text>
<rect x="824" y="486" width="78" height="22" rx="11.0" fill="#E3EAFB" stroke="none" stroke-width="0"/>
<text x="863.0" y="501.0" font-size="11" font-weight="700" fill="#2B4A9B" text-anchor="middle">Medium</text>
<rect x="30" y="524" width="900" height="44" rx="8" fill="#FFFFFF" stroke="#E3EAE5" stroke-width="1"/>
<text x="44" y="543" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">Subject key</text>
<text x="304" y="550" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">each security server</text>
<text x="494" y="550" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Keyed hash that keeps identifiers out of the logs.</text>
<rect x="824" y="535" width="78" height="22" rx="11.0" fill="#E3EAFB" stroke="none" stroke-width="0"/>
<text x="863.0" y="550.0" font-size="11" font-weight="700" fill="#2B4A9B" text-anchor="middle">Medium</text>
<rect x="30" y="573" width="900" height="44" rx="8" fill="#F6F9F7" stroke="#E3EAE5" stroke-width="1"/>
<text x="44" y="592" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">Enrolment token</text>
<text x="44" y="608" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" font-style="italic">Single use</text>
<text x="304" y="599" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start">a new member, once</text>
<text x="494" y="599" font-size="12" font-weight="400" fill="#0F172A" text-anchor="start">Lets one organisation obtain its first certificate.</text>
<rect x="824" y="584" width="78" height="22" rx="11.0" fill="#EAF4EE" stroke="none" stroke-width="0"/>
<text x="863.0" y="599.0" font-size="11" font-weight="700" fill="#1F7A4D" text-anchor="middle">Low</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Z-Road at a glance</title><desc>The authority issues identities; organisations keep their own data and exchange signed, logged requests through security servers; citizens see who looked at their data.</desc>
<defs><marker id="a-64748B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="a-E6B800" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E6B800"/></marker><marker id="a-2B4A9B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B4A9B"/></marker><marker id="a-B42318" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker><marker id="a-1F7A4D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A4D"/></marker><marker id="a-0F172A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="a-94A3B8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="a-9B1C1C" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B1C1C"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs>
<rect x="0.5" y="0.5" width="959" height="599" rx="18" fill="#FBFCFA" stroke="#DDE5DF"/>
<rect x="0.5" y="0.5" width="959" height="6" rx="3" fill="#1F7A4D"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#0F172A">Z-Road at a glance</text><text x="40" y="66" font-size="13" fill="#64748B">Nobody stores a central copy of the data. Organisations ask each other, and every question is signed and logged.</text>
<rect x="250" y="84" width="460" height="112" rx="16" fill="#FFFAE6" stroke="#E6B800" stroke-width="1.2" fill-opacity="0.85"/>
<text x="268" y="109" font-size="10.5" font-weight="700" fill="#9A7B00" text-anchor="start" letter-spacing="1.2">THE AUTHORITY (ONE PER NETWORK)</text>
<rect x="270" y="112" width="200" height="70" rx="12" fill="#FFF3C4" stroke="#E6B800" stroke-width="1.2" filter="url(#sh)"/>
<text x="370.0" y="145.0" font-size="14" font-weight="600" fill="#6B5200" text-anchor="middle">Central server</text>
<text x="370.0" y="163.0" font-size="11.5" font-weight="400" fill="#8A6D00" text-anchor="middle">CA + member directory</text>
<rect x="490" y="112" width="200" height="70" rx="12" fill="#FFF3C4" stroke="#E6B800" stroke-width="1.2" filter="url(#sh)"/>
<text x="590.0" y="145.0" font-size="14" font-weight="600" fill="#6B5200" text-anchor="middle">Timestamp authority</text>
<text x="590.0" y="163.0" font-size="11.5" font-weight="400" fill="#8A6D00" text-anchor="middle">dates the audit logs</text>
<rect x="24" y="232" width="330" height="190" rx="16" fill="#EAF4EE" stroke="#C9DDD0" stroke-width="1.2" fill-opacity="0.85"/>
<text x="42" y="257" font-size="10.5" font-weight="700" fill="#1F7A4D" text-anchor="start" letter-spacing="1.2">PROVIDER  (E.G. ZIMRA)</text>
<rect x="44" y="270" width="130" height="90" rx="12" fill="#FFFFFF" stroke="#C9D3CC" stroke-width="1.2" filter="url(#sh)"/>
<text x="109.0" y="313.0" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Internal system</text>
<text x="109.0" y="331.0" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">registry, database</text>
<rect x="204" y="270" width="130" height="90" rx="12" fill="#1F7A4D" stroke="#1F7A4D" stroke-width="1.2" filter="url(#sh)"/>
<text x="269.0" y="313.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Security server</text>
<text x="269.0" y="331.0" font-size="11.5" font-weight="400" fill="#CFE9DA" text-anchor="middle">signs · checks · logs</text>
<line x1="174" y1="315" x2="204" y2="315" stroke="#64748B" stroke-width="1.8" marker-end="url(#a-64748B)"/>
<text x="189" y="392" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle" font-style="italic">owns its data</text>
<rect x="606" y="232" width="330" height="190" rx="16" fill="#EAF4EE" stroke="#C9DDD0" stroke-width="1.2" fill-opacity="0.85"/>
<text x="624" y="257" font-size="10.5" font-weight="700" fill="#1F7A4D" text-anchor="start" letter-spacing="1.2">CONSUMER  (E.G. A COMPANY)</text>
<rect x="626" y="270" width="130" height="90" rx="12" fill="#1F7A4D" stroke="#1F7A4D" stroke-width="1.2" filter="url(#sh)"/>
<text x="691.0" y="313.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Security server</text>
<text x="691.0" y="331.0" font-size="11.5" font-weight="400" fill="#CFE9DA" text-anchor="middle">signs · checks · logs</text>
<rect x="786" y="270" width="130" height="90" rx="12" fill="#FFFFFF" stroke="#C9D3CC" stroke-width="1.2" filter="url(#sh)"/>
<text x="851.0" y="313.0" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Application</text>
<text x="851.0" y="331.0" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">ERP, portal, app</text>
<line x1="786" y1="315" x2="756" y2="315" stroke="#64748B" stroke-width="1.8" marker-end="url(#a-64748B)"/>
<text x="771" y="392" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle" font-style="italic">plain HTTP, private</text>
<line x1="334" y1="315" x2="626" y2="315" stroke="#1F7A4D" stroke-width="3.6" marker-end="url(#a-1F7A4D)" marker-start="url(#a-1F7A4D)"/>
<rect x="402" y="297" width="156" height="24" rx="12" fill="#1F7A4D" stroke="none" stroke-width="0"/>
<text x="480" y="313.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">mutual TLS channel</text>
<text x="480" y="345" font-size="11.5" font-weight="600" fill="#1F7A4D" text-anchor="middle">signed · timestamped · logged</text>
<path d="M 330,182 C 330,230 270,225 270,270" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#a-94A3B8)"/>
<path d="M 630,182 C 630,230 690,225 690,270" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#a-94A3B8)"/>
<text x="480" y="224" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle" font-style="italic">identities and time, never the data</text>
<rect x="24" y="450" width="330" height="128" rx="16" fill="#F1F5FD" stroke="#9DB2E8" stroke-width="1.2" fill-opacity="0.85"/>
<text x="42" y="475" font-size="10.5" font-weight="700" fill="#2B4A9B" text-anchor="start" letter-spacing="1.2">CITIZENS</text>
<rect x="44" y="484" width="130" height="70" rx="12" fill="#E3EAFB" stroke="#9DB2E8" stroke-width="1.2" filter="url(#sh)"/>
<text x="109.0" y="517.0" font-size="14" font-weight="600" fill="#2B4A9B" text-anchor="middle">Citizen</text>
<text x="109.0" y="535.0" font-size="11.5" font-weight="400" fill="#5A74B8" text-anchor="middle">logs in to the provider</text>
<rect x="204" y="484" width="130" height="70" rx="12" fill="#E3EAFB" stroke="#9DB2E8" stroke-width="1.2" filter="url(#sh)"/>
<text x="269.0" y="517.0" font-size="14" font-weight="600" fill="#2B4A9B" text-anchor="middle">Portal</text>
<text x="269.0" y="535.0" font-size="11.5" font-weight="400" fill="#5A74B8" text-anchor="middle">asks on their behalf</text>
<line x1="174" y1="519" x2="204" y2="519" stroke="#2B4A9B" stroke-width="1.8" marker-end="url(#a-2B4A9B)"/>
<path d="M 269,484 C 269,455 269,440 269,360" fill="none" stroke="#2B4A9B" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-2B4A9B)"/>
<text x="285" y="452" font-size="11" font-weight="400" fill="#2B4A9B" text-anchor="start" font-style="italic">“who looked at my record?”</text>
<rect x="606" y="450" width="330" height="128" rx="16" fill="#F4F6F5" stroke="#CBD5D0" stroke-width="1.2" fill-opacity="0.85"/>
<text x="624" y="475" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1.2">SHARED NODE (A VENDOR)</text>
<rect x="626" y="484" width="140" height="70" rx="12" fill="#FFFFFF" stroke="#C9D3CC" stroke-width="1.2" filter="url(#sh)"/>
<text x="696.0" y="517.0" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Hosted members</text>
<text x="696.0" y="535.0" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">keep their own keys</text>
<rect x="786" y="484" width="130" height="70" rx="12" fill="#EAF4EE" stroke="#C9DDD0" stroke-width="1.2" filter="url(#sh)"/>
<text x="851.0" y="517.0" font-size="14" font-weight="600" fill="#14593A" text-anchor="middle">Signer services</text>
<text x="851.0" y="535.0" font-size="11.5" font-weight="400" fill="#4C7A62" text-anchor="middle">on the members' machines</text>
<line x1="786" y1="519" x2="766" y2="519" stroke="#64748B" stroke-width="1.6" marker-end="url(#a-64748B)"/>
<path d="M 771,484 C 771,455 771,440 771,360" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-94A3B8)"/>
<text x="790" y="452" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" font-style="italic">same protocol</text>
<rect x="380" y="484" width="170" height="70" rx="12" fill="#FFFFFF" stroke="#C9D3CC" stroke-width="1.2" filter="url(#sh)"/>
<text x="465.0" y="517.0" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Auditor</text>
<text x="465.0" y="535.0" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">verifies logs and proofs offline</text>
<path d="M 465,484 C 465,430 400,400 330,372" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="3 4" marker-end="url(#a-94A3B8)"/>
</svg>

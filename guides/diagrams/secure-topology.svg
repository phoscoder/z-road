<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A secure network layout for one security server</title><desc>Network zones: peers reach only the mutual TLS port; internal systems and administrators stay on private networks; secrets live in a vault or HSM.</desc>
<defs><marker id="a-64748B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="a-E6B800" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E6B800"/></marker><marker id="a-2B4A9B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B4A9B"/></marker><marker id="a-B42318" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker><marker id="a-1F7A4D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A4D"/></marker><marker id="a-0F172A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker><marker id="a-94A3B8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="a-9B1C1C" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B1C1C"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs>
<rect x="0.5" y="0.5" width="959" height="639" rx="18" fill="#FBFCFA" stroke="#DDE5DF"/>
<rect x="0.5" y="0.5" width="959" height="6" rx="3" fill="#1F7A4D"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#0F172A">A secure layout for one node</text><text x="40" y="66" font-size="13" fill="#64748B">Only one port faces other organisations. Everything else stays private.</text>
<rect x="20" y="92" width="200" height="400" rx="16" fill="#F4F6F5" stroke="#CBD5D0" stroke-width="1.2" fill-opacity="0.85"/>
<text x="38" y="117" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1.2">OTHER MEMBERS</text>
<rect x="240" y="92" width="210" height="400" rx="16" fill="#FFFAE6" stroke="#E6B800" stroke-width="1.2" fill-opacity="0.85"/>
<text x="258" y="117" font-size="10.5" font-weight="700" fill="#9A7B00" text-anchor="start" letter-spacing="1.2">DMZ</text>
<rect x="470" y="92" width="270" height="400" rx="16" fill="#EAF4EE" stroke="#C9DDD0" stroke-width="1.2" fill-opacity="0.85"/>
<text x="488" y="117" font-size="10.5" font-weight="700" fill="#1F7A4D" text-anchor="start" letter-spacing="1.2">INTERNAL NETWORK</text>
<rect x="760" y="92" width="180" height="400" rx="16" fill="#F1F5FD" stroke="#9DB2E8" stroke-width="1.2" fill-opacity="0.85"/>
<text x="778" y="117" font-size="10.5" font-weight="700" fill="#2B4A9B" text-anchor="start" letter-spacing="1.2">MANAGEMENT</text>
<rect x="40" y="140" width="160" height="70" rx="12" fill="#FFFFFF" stroke="#C9D3CC" stroke-width="1.2" filter="url(#sh)"/>
<text x="120.0" y="173.0" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Peer security servers</text>
<text x="120.0" y="191.0" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">mutual TLS only</text>
<rect x="40" y="232" width="160" height="70" rx="12" fill="#FFFFFF" stroke="#C9D3CC" stroke-width="1.2" filter="url(#sh)"/>
<text x="120.0" y="265.0" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Central server</text>
<text x="120.0" y="283.0" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">directory, CA</text>
<rect x="40" y="324" width="160" height="70" rx="12" fill="#FFFFFF" stroke="#C9D3CC" stroke-width="1.2" filter="url(#sh)"/>
<text x="120.0" y="357.0" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Timestamp authority</text>
<text x="120.0" y="375.0" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle"></text>
<rect x="224" y="120" width="12" height="350" rx="3" fill="#B42318" stroke="none" stroke-width="0"/>
<text x="20" y="512" font-size="11.5" font-weight="600" fill="#B42318" text-anchor="start">Firewall: only member addresses may reach port 7443. Nothing else is exposed.</text>
<rect x="252" y="150" width="190" height="100" rx="12" fill="#1F7A4D" stroke="#1F7A4D" stroke-width="1.2" filter="url(#sh)"/>
<text x="347.0" y="190.0" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Security server</text>
<text x="347.0" y="208.0" font-size="11.5" font-weight="400" fill="#CFE9DA" text-anchor="middle">network listener :7443</text>
<text x="347.0" y="224.0" font-size="11.5" font-weight="400" fill="#CFE9DA" text-anchor="middle">client certificates required</text>
<line x1="200" y1="175" x2="252" y2="195" stroke="#1F7A4D" stroke-width="2.6" marker-end="url(#a-1F7A4D)"/>
<line x1="200" y1="267" x2="256" y2="238" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a-94A3B8)"/>
<line x1="200" y1="359" x2="266" y2="248" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a-94A3B8)"/>
<text x="262" y="300" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" font-style="italic">A reverse proxy or rate</text>
<text x="262" y="314" font-size="11" font-weight="400" fill="#64748B" text-anchor="start" font-style="italic">limiting can sit in front.</text>
<rect x="485" y="150" width="215" height="100" rx="12" fill="#EAF4EE" stroke="#C9DDD0" stroke-width="1.2" filter="url(#sh)"/>
<text x="592.5" y="190.0" font-size="14" font-weight="600" fill="#14593A" text-anchor="middle">Internal listener</text>
<text x="592.5" y="208.0" font-size="11.5" font-weight="400" fill="#4C7A62" text-anchor="middle">same process, private address</text>
<text x="592.5" y="224.0" font-size="11.5" font-weight="400" fill="#4C7A62" text-anchor="middle">e.g. 10.0.0.5:7001</text>
<line x1="442" y1="200" x2="485" y2="200" stroke="#64748B" stroke-width="1.8"/>
<rect x="485" y="290" width="130" height="70" rx="12" fill="#FFFFFF" stroke="#C9D3CC" stroke-width="1.2" filter="url(#sh)"/>
<text x="550.0" y="323.0" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Internal system</text>
<text x="550.0" y="341.0" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">upstream :9001</text>
<rect x="630" y="290" width="90" height="70" rx="12" fill="#FFFFFF" stroke="#C9D3CC" stroke-width="1.2" filter="url(#sh)"/>
<text x="675.0" y="323.0" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Database</text>
<text x="675.0" y="341.0" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle"></text>
<line x1="550" y1="250" x2="550" y2="290" stroke="#64748B" stroke-width="1.8" marker-end="url(#a-64748B)"/>
<line x1="615" y1="325" x2="630" y2="325" stroke="#64748B" stroke-width="1.8" marker-end="url(#a-64748B)"/>
<rect x="485" y="390" width="235" height="70" rx="12" fill="#FFFFFF" stroke="#C9D3CC" stroke-width="1.2" filter="url(#sh)"/>
<text x="602.5" y="423.0" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Your applications</text>
<text x="602.5" y="441.0" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">call the internal listener</text>
<line x1="602" y1="390" x2="602" y2="250" stroke="#64748B" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#a-64748B)"/>
<rect x="780" y="140" width="140" height="70" rx="12" fill="#E3EAFB" stroke="#9DB2E8" stroke-width="1.2" filter="url(#sh)"/>
<text x="850.0" y="173.0" font-size="14" font-weight="600" fill="#2B4A9B" text-anchor="middle">Operators</text>
<text x="850.0" y="191.0" font-size="11.5" font-weight="400" fill="#5A74B8" text-anchor="middle">named tokens, roles</text>
<rect x="780" y="232" width="140" height="70" rx="12" fill="#E3EAFB" stroke="#9DB2E8" stroke-width="1.2" filter="url(#sh)"/>
<text x="850.0" y="265.0" font-size="14" font-weight="600" fill="#2B4A9B" text-anchor="middle">Bastion / VPN</text>
<text x="850.0" y="283.0" font-size="11.5" font-weight="400" fill="#5A74B8" text-anchor="middle">the only way in</text>
<rect x="780" y="324" width="140" height="70" rx="12" fill="#E3EAFB" stroke="#9DB2E8" stroke-width="1.2" filter="url(#sh)"/>
<text x="850.0" y="357.0" font-size="14" font-weight="600" fill="#2B4A9B" text-anchor="middle">Monitoring</text>
<text x="850.0" y="375.0" font-size="11.5" font-weight="400" fill="#5A74B8" text-anchor="middle">logs, alerts</text>
<rect x="780" y="410" width="140" height="60" rx="12" fill="#E3EAFB" stroke="#9DB2E8" stroke-width="1.2" filter="url(#sh)"/>
<text x="850.0" y="438.0" font-size="14" font-weight="600" fill="#2B4A9B" text-anchor="middle">Backups</text>
<text x="850.0" y="456.0" font-size="11.5" font-weight="400" fill="#5A74B8" text-anchor="middle">encrypted, offline copy</text>
<path d="M 780,267 C 750,267 740,215 700,205" fill="none" stroke="#2B4A9B" stroke-width="1.6" marker-end="url(#a-2B4A9B)"/>
<rect x="240" y="530" width="700" height="84" rx="14" fill="#FFF3C4" stroke="#E6B800" stroke-width="1.2"/>
<text x="258" y="554" font-size="10.5" font-weight="700" fill="#9A7B00" text-anchor="start" letter-spacing="1.2">SECRETS</text>
<text x="258" y="580" font-size="12.5" font-weight="600" fill="#6B5200" text-anchor="start">Private keys (key.pem), CA key, operator tokens:</text>
<text x="258" y="598" font-size="11.5" font-weight="400" fill="#8A6D00" text-anchor="start">0600 files owned by the service user at minimum; an HSM or vault for the CA key. Never in images, chat or tickets.</text>
<line x1="420" y1="250" x2="420" y2="530" stroke="#E6B800" stroke-width="1.4" stroke-dasharray="3 4"/>
</svg>

[workspace]
resolver = "2"
members = [
  "crates/zroad-core",
  "crates/zroad-net",
  "crates/central-server",
  "crates/timestamp-service",
  "crates/security-server",
  "crates/zroad-cli",
  "crates/e2e-tests",
  "examples/zimra-clearance",
  "examples/buyer-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.7.9", default-features = false, features = ["http1", "http2", "json", "tokio", "query"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["pem"] }
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service", "http1", "http2"] }
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "1"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "signal", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.8"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-parser = "0.16"

zroad-core = { path = "crates/zroad-core" }
zroad-net = { path = "crates/zroad-net" }
central-server = { path = "crates/central-server" }
timestamp-service = { path = "crates/timestamp-service" }
security-server = { path = "crates/security-server" }

[workspace.lints.rust]
unsafe_code = "forbid"
